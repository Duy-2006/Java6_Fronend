version: '3.8'

services:
  # 1. Database SQL Server (Môi trường chứa dữ liệu quan hệ chính)
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: bookstore-db
    restart: always
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_PASSWORD}
      - MSSQL_PID=Developer
    volumes:
      - mssql_data:/var/opt/mssql
    networks:
      - bookstore-network

  # 2. Qdrant Vector Database (Lưu trữ chỉ mục chatbot RAG)
  qdrant:
    image: qdrant/qdrant:latest
    container_name: bookstore-qdrant
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - bookstore-network

  # 3. Python AI Service (FastAPI / edge-tts / OpenCLIP / FAISS)
  python-ai:
    build:
      context: ./TTS-Python-Service
      dockerfile: Dockerfile
    container_name: bookstore-python-ai
    restart: always
    expose:
      - "8000"
    ports:
      - "8000:8000" # Expose ra ngoài để test nếu cần, hoặc bỏ đi để tăng bảo mật
    environment:
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
    volumes:
      - python_temp:/tmp/tts_audio_temp
    networks:
      - bookstore-network

  # 4. Backend (Spring Boot Core)
  backend:
    build:
      context: ../backend # Chỉnh lại đường dẫn tương đối tới repo backend trên VPS
      dockerfile: Dockerfile
    container_name: bookstore-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      # Database Connection
      - SPRING_DATASOURCE_URL=jdbc:sqlserver://sqlserver:1433;databaseName=${MSSQL_DATABASE};encrypt=true;trustServerCertificate=true;
      - SPRING_DATASOURCE_USERNAME=sa
      - SPRING_DATASOURCE_PASSWORD=${MSSQL_PASSWORD}
      
      # Google Gemini AI & Qdrant
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GEMINI_CHAT_MODEL=${GEMINI_CHAT_MODEL}
      - VECTOR_STORE_HOST=qdrant
      - VECTOR_STORE_PORT=6334
      
      # Python AI service endpoint
      - APP_PYTHON_SERVICE_URL=http://python-ai:8000
      
      # Cloudinary CDN
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      
      # Email SMTP
      - SPRING_MAIL_USERNAME=${MAIL_USERNAME}
      - SPRING_MAIL_PASSWORD=${MAIL_PASSWORD}
      
      # Google OAuth
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      
      # Payments & APIs
      - VNPAY_TMN_CODE=${VNPAY_TMN_CODE}
      - VNPAY_HASH_SECRET=${VNPAY_HASH_SECRET}
      - PAYOS_CLIENT_ID=${PAYOS_CLIENT_ID}
      - PAYOS_API_KEY=${PAYOS_API_KEY}
      - PAYOS_CHECKSUM_KEY=${PAYOS_CHECKSUM_KEY}
      - GHTK_API_TOKEN=${GHTK_API_TOKEN}
      
      # Frontend Host Integration
      - APP_FRONTEND_URL=${FRONTEND_URL}
      - FRONTEND_URL=${FRONTEND_URL}
    depends_on:
      - sqlserver
      - qdrant
      - python-ai
    networks:
      - bookstore-network

  # 5. Frontend (Next.js)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    container_name: bookstore-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
    depends_on:
      - backend
    networks:
      - bookstore-network

networks:
  bookstore-network:
    driver: bridge

volumes:
  mssql_data:
  qdrant_data:
  python_temp:
