<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{head :: head}"></head>

<body class="bg-[#f5f5f5] font-display text-[#222]">

	<!-- MENU -->
	<div th:replace="menu :: menu"></div>

	<main class="max-w-[1200px] mx-auto px-4 pt-8 pb-36">

		<!-- TITLE -->
		<div class="mb-6">
			<h2 class="text-3xl font-extrabold">🛒 Giỏ hàng</h2>
		</div>

		<!-- HEADER -->
		<div class="hidden md:grid grid-cols-[40px_1fr_160px_140px_80px] items-center gap-4 px-6 py-4 bg-gray-50 text-sm font-bold text-gray-500 border-b">
			<span></span> 
			<span>Sản phẩm</span> 
			<span class="text-center">Giá</span>
			<span class="text-center">Số lượng</span> 
			<span class="text-center">Xóa</span>
		</div>

		<!-- CART ITEMS -->
		<div th:each="item : ${cartItems}" 
             class="cart-item grid grid-cols-[40px_1fr_160px_140px_80px] items-center gap-4 px-6 py-5 border-b"
             th:data-price="${item.finalPrice}" 
             th:data-quantity="${item.quantity}">

			<!-- CHECKBOX -->
			<input type="checkbox" class="cart-checkbox"
				th:data-id="${item.cartDetailId}" 
                th:checked="${item.selected}">

			<!-- PRODUCT -->
			<div class="flex gap-4 items-center">
				<div class="w-24 h-32 rounded-xl bg-cover bg-center shadow-sm"
					th:style="'background-image:url(' + ${item.imageUrl} + ')'"></div>

				<div>
					<p class="font-bold text-lg" th:text="${item.title}"></p>
					<p class="text-xs text-gray-500 uppercase" th:text="${item.author}"></p>
				</div>
			</div>

			<!-- PRICE -->
			<div class="text-center">
                <!-- Giá gốc (gạch ngang nếu có khuyến mãi) -->
                <div th:if="${item.discountPercent != null and item.discountPercent > 0}" 
                     class="text-sm text-gray-400 line-through">
                    <span th:text="${#numbers.formatDecimal(item.originalPrice, 0, 'COMMA', 0, 'POINT')} + 'đ'"></span>
                </div>
                
                <!-- Giá sau khuyến mãi -->
                <div class="text-primary font-extrabold text-lg"
                     th:text="${#numbers.formatDecimal(item.finalPrice, 0, 'COMMA', 0, 'POINT')} + 'đ'">
                </div>

                <!-- Badge % giảm -->
                <div th:if="${item.discountPercent != null and item.discountPercent > 0}" 
                     class="inline-block mt-1 px-3 py-1 text-xs font-bold bg-red-100 text-red-600 rounded-full">
                    -<span th:text="${item.discountPercent}"></span>%
                </div>
			</div>

			<!-- QUANTITY -->
			<div class="flex justify-center items-center gap-2 quantity-box">
				<button type="button" class="qty-btn minus"
					th:data-id="${item.cartDetailId}">−</button>

				<span class="font-bold quantity" th:text="${item.quantity}"></span>

				<button type="button" class="qty-btn plus"
					th:data-id="${item.cartDetailId}">+</button>
			</div>

			<!-- DELETE -->
			<button type="button"
				class="delete-btn text-red-500 hover:bg-red-50 rounded-full p-3"
				th:data-id="${item.cartDetailId}">🗑️</button>
		</div>

	</main>

	<!-- CHECKOUT BAR -->
	<div class="fixed bottom-0 left-0 right-0 bg-white border-t shadow-lg">
		<div class="max-w-[1200px] mx-auto px-4 py-4 flex items-center justify-between">
			<div>
				<p class="text-xs text-gray-500 font-bold">TỔNG THANH TOÁN</p>
				<p class="text-3xl font-extrabold text-primary" id="totalPrice">0đ</p>
				<p class="text-xs text-gray-500" id="selectedCount">(0 sản phẩm)</p>
			</div>

			<a href="/checkout" id="checkoutBtn"
				class="px-8 py-3 bg-primary text-white rounded-xl font-bold opacity-50 pointer-events-none transition">
				Thanh toán →
			</a>
		</div>
	</div>

	<!-- JS giữ nguyên như cũ của bạn -->
	<script>
    // ... (giữ nguyên toàn bộ script bạn đã có)
    // Chỉ cần updateUI() để tính tổng từ finalPrice thay vì price
    </script>

	<!-- FOOTER -->
	<div th:replace="footer :: footer"></div>

	<style>
    /* CSS cũ của bạn */
    .qty-btn {
        width: 32px;
        height: 32px;
        border-radius: 8px;
        background: #f3f4f6;
        font-weight: bold;
        font-size: 18px;
        cursor: pointer;
        transition: .2s;
    }
    .qty-btn:hover {
        background: #e5e7eb;
    }
    </style>

</body>
</html>
